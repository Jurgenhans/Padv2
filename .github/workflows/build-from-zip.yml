
name: Pad7 Launcher aus ZIP bauen

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository herunterladen
        uses: actions/checkout@v4

      - name: Java 17 installieren
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9 einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v4

      - name: Android Pakete einzeln installieren
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: ZIP entpacken
        run: |
          mkdir -p source
          unzip -o Pad7Launcher-GitHub.zip -d source

      - name: Android Projekt finden
        run: |
          PROJECT_DIR=$(find source -name settings.gradle -type f -printf '%h\n' | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            echo "FEHLER: settings.gradle nicht gefunden!"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Projekt gefunden: $PROJECT_DIR"

      - name: APK bauen
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace assembleDebug

      - name: APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Pad7-Launcher-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
