
name: Pad7 Launcher aus ZIP bauen

on:
  push:
    branches:
      - main
    paths:
      - 'Pad7Launcher-GitHub.zip'
      - '.github/workflows/build-from-zip.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository herunterladen
        uses: actions/checkout@v4

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3

      - name: Android SDK Pakete installieren
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: ZIP entpacken
        run: |
          mkdir -p source
          unzip -o Pad7Launcher-GitHub.zip -d source
          find source -name settings.gradle -o -name settings.gradle.kts

      - name: Projektverzeichnis finden
        run: |
          PROJECT_DIR=$(find source -name settings.gradle -printf '%h\n' | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            echo "Keine settings.gradle in der ZIP gefunden!"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: APK bauen
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Pad7-Launcher-APK
          path: source/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
